name: Build and Deploy to Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:      # 支持在 GitHub 网页上手动点一次部署

permissions:
  contents: write         # 推送到 gh-pages 分支所需

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CI: false            # 关掉 CRA 把 warning 当 error 的行为，避免因告警构建失败

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
